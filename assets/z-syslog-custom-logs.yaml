onsuccess: next_stage
name: clownhouse/syslog-custom-logs
description: "Parse Unraid sshd-session and general host syslog lines"
filter: "evt.Parsed.logsource == 'syslog' && evt.Meta.log_type == ''"
pattern_syntax:
  URCHIN_IPV4: (?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)
  URCHIN_IP: (?:%{IPV6}|%{URCHIN_IPV4})
nodes:
  - grok:
      pattern: "Accepted (publickey|password) for %{USERNAME:sshd_auth_user} from %{URCHIN_IP:sshd_client_ip} port %{NUMBER:sshd_client_port} ssh2%{GREEDYDATA:sshd_trail}"
      apply_on: message
      statics:
        - meta: service
          value: ssh
        - meta: source_ip
          expression: "evt.Parsed.sshd_client_ip"
        - meta: user
          expression: "evt.Parsed.sshd_auth_user"
        - meta: log_type
          value: auth_success
  - grok:
      pattern: "^%{GREEDYDATA:syslog_msg}"
      apply_on: message
      statics:
        - meta: service
          value: syslog
        - meta: log_type
          value: syslog_general
