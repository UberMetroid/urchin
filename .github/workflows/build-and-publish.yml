name: Build & Publish Reproducible Guix Container

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-gnu

      - name: Step 1 - Rust Gate & Unit Tests
        run: cargo test --workspace --all-targets

      - name: Step 2 - Strict Clippy Zero-Panic Gate
        run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

      - name: Step 3 - Rust Formatting Check
        run: cargo fmt --all -- --check

      - name: Step 4 - Build Static Rust Supervision Binaries
        run: |
          RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --workspace --target x86_64-unknown-linux-gnu
          mkdir -p prebuilt
          cp target/x86_64-unknown-linux-gnu/release/urchin-init prebuilt/
          cp target/x86_64-unknown-linux-gnu/release/urchin-provision prebuilt/
          cp target/x86_64-unknown-linux-gnu/release/urchin-health prebuilt/
          chmod 755 prebuilt/urchin-*

      - name: Extract Latest Upstream CrowdSec, cscli & Hub/AppSec Rules
        run: |
          docker pull crowdsecurity/crowdsec:latest
          CID=$(docker run -d -e COLLECTIONS="crowdsecurity/linux crowdsecurity/caddy crowdsecurity/http-cve crowdsecurity/base-http-scenarios crowdsecurity/whitelist-good-actors crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules LePresidente/emby LePresidente/jellyfin" crowdsecurity/crowdsec:latest)
          sleep 20
          docker cp "$CID:/usr/local/bin/crowdsec" prebuilt/crowdsec
          docker cp "$CID:/usr/local/bin/cscli" prebuilt/cscli
          docker cp "$CID:/staging" prebuilt/staging
          docker cp "$CID:/etc/crowdsec/hub" prebuilt/staging/etc/crowdsec/
          find prebuilt/staging -type l -delete
          docker rm -fv "$CID"
          chmod 755 prebuilt/crowdsec prebuilt/cscli

      - name: Install GNU Guix & Pack Reproducible Docker Image
        run: |
          if ! command -v guix >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y guix || true
          fi
          if command -v guix >/dev/null 2>&1; then
            PACK_PATH=$(guix pack -f docker --entry-point=/bin/urchin-init -S /bin=bin -S /etc=etc -S /share=share -m manifest.scm | tail -n 1)
            cp "$PACK_PATH" urchin-guix-docker-x86_64.tar.gz
          else
            curl -fL -o urchin-guix-docker-x86_64.tar.gz https://github.com/UberMetroid/urchin/releases/download/v0.1.0/urchin-guix-docker-x86_64.tar.gz
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load Guix Container, Smoke-Test & Push Updated Digest to GHCR
        run: |
          IMAGE_NAME=$(docker load -i urchin-guix-docker-x86_64.tar.gz | awk -F': ' '/Loaded image:/ {print $2}')
          CONTAINER_ID=$(docker create "$IMAGE_NAME" /bin/urchin-init)
          docker cp prebuilt/urchin-init "$CONTAINER_ID":/bin/urchin-init
          docker cp prebuilt/urchin-provision "$CONTAINER_ID":/bin/urchin-provision
          docker cp prebuilt/urchin-health "$CONTAINER_ID":/bin/urchin-health
          docker cp prebuilt/crowdsec "$CONTAINER_ID":/bin/crowdsec
          docker cp prebuilt/cscli "$CONTAINER_ID":/bin/cscli
          docker cp prebuilt/staging/. "$CONTAINER_ID":/share/crowdsec/staging/
          docker commit \
            --change 'ENTRYPOINT ["/bin/urchin-init"]' \
            --change 'HEALTHCHECK --interval=30s --timeout=5s --retries=3 CMD ["/bin/urchin-health", "--check"]' \
            "$CONTAINER_ID" ghcr.io/ubermetroid/urchin:latest
          docker rm -f "$CONTAINER_ID"
          docker run -d --name urchin-smoke -e DISABLE_ONLINE_API=true -e BOUNCER_KEY_CADDY=smoke_test_key ghcr.io/ubermetroid/urchin:latest
          for i in $(seq 1 20); do
            sleep 2
            if docker exec urchin-smoke /bin/urchin-health --check; then
              break
            fi
          done
          docker exec urchin-smoke /bin/urchin-health --check
          docker rm -fv urchin-smoke
          docker tag ghcr.io/ubermetroid/urchin:latest ghcr.io/ubermetroid/urchin:v0.1.0
          docker push ghcr.io/ubermetroid/urchin:latest
          docker push ghcr.io/ubermetroid/urchin:v0.1.0
